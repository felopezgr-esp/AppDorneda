name: Actualizar FUTGAL
run-name: ${{ github.event_name == 'workflow_run' && format('Auditoría FUTGAL · fast-run-{0}', github.event.workflow_run.id) || format('Actualizar FUTGAL · {0}', inputs.request_id || 'manual') }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Identificador de la solicitud web"
        required: false
        type: string
  workflow_run:
    workflows:
      - "Actualizar FUTGAL rápido"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: futgal-official-data
  cancel-in-progress: false

jobs:
  actualizar:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion != 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "true"
      TZ: Europe/Madrid

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        working-directory: tools/futgal
        run: npm install --no-audit --no-fund

      - name: Instalar Chromium de Playwright
        working-directory: tools/futgal
        run: npx playwright install --with-deps chromium

      - name: Ejecutar auditoría completa FUTGAL
        working-directory: tools/futgal
        run: node actualizar-futgal.js

      - name: Validar salida antes de publicar
        working-directory: tools/futgal
        run: node verificar-salida-github.js

      - name: Preparar JSON público para AppDorneda
        run: |
          cp tools/futgal/competicion.json ./competicion.json
          cp tools/futgal/validacion-competicion.json ./validacion-competicion.json
          cp tools/futgal/diagnostico-cambios-calendario.json ./diagnostico-cambios-calendario.json

      - name: Guardar diagnóstico de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futgal-diagnostico-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            tools/futgal/competicion.json
            tools/futgal/validacion-competicion.json
            tools/futgal/diagnostico-cambios-calendario.json
            tools/futgal/diagnostico-actas.json
            tools/futgal/diagnostico-navegacion.json
            tools/futgal/salida-integracion.txt
            tools/futgal/error-integracion.png
            tools/futgal/errores/

      - name: Publicar solo si todo fue correcto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            competicion.json \
            validacion-competicion.json \
            diagnostico-cambios-calendario.json \
            tools/futgal/checkpoint-actas.json \
            tools/futgal/checkpoint-calendario.json \
            tools/futgal/checkpoint-calendario-parcial.json

          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
          else
            git commit -m "Auditar datos FUTGAL"
            git push
          fi
