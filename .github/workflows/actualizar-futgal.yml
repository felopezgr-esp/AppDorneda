name: Actualizar FUTGAL
run-name: ${{ github.event_name == 'workflow_run' && format('Auditoría FUTGAL · tras botón · {0}', github.event.workflow_run.id) || github.event_name == 'schedule' && 'Auditoría FUTGAL · domingo 23:59' || format('Auditoría FUTGAL · {0}', inputs.request_id || 'manual') }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Identificador de la solicitud web"
        required: false
        type: string
  schedule:
    - cron: '59 23 * * 0'
      timezone: 'Europe/Madrid'
  workflow_run:
    workflows:
      - "Actualizar FUTGAL rápido"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: futgal-official-data
  cancel-in-progress: false

jobs:
  actualizar:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: "true"
      TZ: Europe/Madrid

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        working-directory: tools/futgal
        run: npm install --no-audit --no-fund

      - name: Instalar Chromium
        working-directory: tools/futgal
        run: npx playwright install --with-deps chromium

      - name: Repasar todas las jornadas J1-J30
        working-directory: tools/futgal
        run: node actualizar-futgal.js

      - name: Leer clasificación oficial FUTGAL
        working-directory: tools/futgal
        run: node actualizar-clasificacion-oficial.js

      - name: Comparar goleadores oficiales FUTGAL
        working-directory: tools/futgal
        run: node comparar-goleadores-oficial.js

      - name: Validar salida
        working-directory: tools/futgal
        run: node verificar-salida-github.js

      - name: Preparar JSON público
        run: |
          cp tools/futgal/competicion.json ./competicion.json
          cp tools/futgal/clasificacion-oficial.json ./clasificacion-oficial.json
          cp tools/futgal/validacion-competicion.json ./validacion-competicion.json
          cp tools/futgal/diagnostico-cambios-calendario.json ./diagnostico-cambios-calendario.json
          cp tools/futgal/comparacion-goleadores.json ./comparacion-goleadores.json
          cp tools/futgal/goleadores-oficial.json ./goleadores-oficial.json 2>/dev/null || true

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competicion.json clasificacion-oficial.json validacion-competicion.json \
            diagnostico-cambios-calendario.json comparacion-goleadores.json \
            tools/futgal/checkpoint-actas.json tools/futgal/checkpoint-calendario.json \
            tools/futgal/checkpoint-calendario-parcial.json tools/futgal/comparacion-goleadores.json
          if [ -f goleadores-oficial.json ]; then
            git add goleadores-oficial.json tools/futgal/goleadores-oficial.json
          fi
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
          else
            git commit -m "Auditar FUTGAL completo, clasificación y goleadores"
            git push
          fi
