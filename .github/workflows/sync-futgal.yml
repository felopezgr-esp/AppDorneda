name: Sincronización Automática con FUTGAL

on:
  schedule:
    # 1. Sábados: cada 30 minutos de 14:00 a 22:30 UTC (16:00 a 00:30 hora española peninsular)
    - cron: '*/30 14-22 * * 6'
    # 2. Domingos: cada 30 minutos de 08:00 a 21:30 UTC (10:00 a 23:30 hora española peninsular)
    - cron: '*/30 8-21 * * 0'
    # 3. Lunes: mañanas, tardes y noches (actas oficiales cerradas y resoluciones de comités)
    - cron: '0 5,12,20 * * 1'
    # 4. Jueves y Viernes: actualización de horarios oficiales y designaciones arbitrales
    - cron: '0 11,19 * * 4,5'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-futgal.yml'
      - 'scripts/**'
  workflow_dispatch:
    # Permite la ejecución manual bajo demanda desde GitHub Actions o API

jobs:
  sync:
    name: Sincronizar Partidos de Liga y Copa
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar Sincronizador con FUTGAL y Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/sync-futgal.js

      - name: Guardar Registro y Snapshot si hubo cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Archivos/backups/ || true
          if git diff --staged --quiet; then
            echo "Sin cambios en archivos locales para commit."
          else
            git commit -m "chore(sync): actualizar snapshot de datos FUTGAL [skip ci]"
            git pull --rebase origin main || true
            git push || echo "Push omitido"
          fi
