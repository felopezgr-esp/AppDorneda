name: Actualizar FUTGAL rápido
run-name: ${{ github.event_name == 'schedule' && 'FUTGAL súper rápida · automática' || format('FUTGAL súper rápida · {0}', inputs.request_id || 'manual') }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Identificador de la solicitud web"
        required: false
        type: string
  schedule:
    - cron: '0 15-23 * * 6'
      timezone: 'Europe/Madrid'
    - cron: '0 9-16 * * 0'
      timezone: 'Europe/Madrid'

permissions:
  contents: write

concurrency:
  group: futgal-official-data
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      TZ: Europe/Madrid
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        working-directory: tools/futgal
        run: npm install --no-audit --no-fund
      - name: Instalar Chromium
        working-directory: tools/futgal
        run: npx playwright install --with-deps chromium
      - name: Actualizar jornada actual
        working-directory: tools/futgal
        run: node actualizar-futgal-rapido.js
      - name: Preservar clasificación oficial
        working-directory: tools/futgal
        run: node preservar-clasificacion-oficial.js
      - name: Validar salida
        working-directory: tools/futgal
        run: node verificar-salida-github.js
      - name: Preparar JSON público
        run: |
          cp tools/futgal/competicion.json ./competicion.json
          cp tools/futgal/validacion-competicion.json ./validacion-competicion.json
          cp tools/futgal/diagnostico-cambios-calendario.json ./diagnostico-cambios-calendario.json
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competicion.json validacion-competicion.json diagnostico-cambios-calendario.json \
            tools/futgal/checkpoint-actas.json tools/futgal/checkpoint-calendario.json \
            tools/futgal/checkpoint-calendario-parcial.json
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
          else
            git commit -m "Actualizar FUTGAL súper rápido"
            git push
          fi
